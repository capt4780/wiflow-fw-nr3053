<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="theme-color" content="#F3F5F9">
  <title>Wiflow</title>
  <link rel="icon" href="/assets/wiflow-logo.png">
  <link rel="stylesheet" href="/assets/setup-v2.css?v=1.0.26">
</head>
<body>
  <main class="auth">
    <section class="auth-card">
      <div class="auth-logo"><img src="/assets/wiflow-logo.png" alt="Wiflow"></div>
      <div class="sx-h"><h1>Mở Wiflow</h1><p>Nhập mã bảo mật thiết bị.</p></div>
      <div id="err" class="al err" role="alert" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>Mã bảo mật không đúng. Sai 5 lần sẽ khóa 1 phút.</div></div>
      <div id="err2" class="al err" role="alert" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>Thiết bị chưa sẵn sàng. Khởi động lại router, đợi 2 phút rồi thử lại.</div></div>
      <form method="post" action="/cgi-bin/gate">
        <label class="f">Mã bảo mật<span class="f-in"><input id="pin" class="has-eye code-in" name="pin" type="password" maxlength="16" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="one-time-code" inputmode="text" autofocus required><button type="button" class="eye" data-eye="pin" aria-label="Hiện mã"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
        <button class="btn pri" type="submit">Tiếp tục</button>
      </form>
    </section>
    <div class="sx-foot"><a href="tel:0833880100">Hỗ trợ <b>0833 880 100</b></a> · <a href="mailto:wiflow@projifylab.com">wiflow@projifylab.com</a></div>
  </main>
  <script>
    fetch('/cgi-bin/gate-status',{cache:'no-store',credentials:'same-origin'}).then(r=>r.json()).then(x=>{if(x.authenticated)location.replace('/setup.html');else if(x.unlocked)location.replace('/login.html')}).catch(()=>{});
    if(location.search.includes('error=1'))document.getElementById('err').hidden=false;if(location.search.includes('error=2'))document.getElementById('err2').hidden=false;
    document.querySelectorAll('[data-eye]').forEach(function(b){b.onclick=function(){var i=document.getElementById(b.dataset.eye);i.type=i.type==='password'?'text':'password'}});
  </script>
</body>
</html>
