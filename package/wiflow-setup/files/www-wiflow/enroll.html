<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiflow - Thiết lập đăng nhập</title><link rel="stylesheet" href="/assets/setup-v1.css"></head><body><main class="wf-shell wf-auth-shell"><section class="wf-card wf-auth-card"><h1 class="wf-title">Thiết lập tài khoản</h1><div id="err" class="wf-error" hidden>Mật khẩu không hợp lệ hoặc không trùng khớp.</div><form method="post" action="/cgi-bin/enroll" autocomplete="off"><label for="username">Tài khoản</label><input id="username" class="wf-input" name="username" value="wiflow" readonly required><label for="password">Mật khẩu mới (tối thiểu 12 ký tự)</label><input id="password" class="wf-input" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm_password">Nhập lại mật khẩu</label><input id="confirm_password" class="wf-input" name="confirm_password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button class="wf-btn primary wf-full" type="submit">Thiết lập</button></form></section></main><script>fetch('/cgi-bin/gate-status',{cache:'no-store',credentials:'same-origin'}).then(r=>r.json()).then(x=>{if(x.authenticated)location.replace('/setup.html');else if(!x.unlocked)location.replace('/');else if(!x.setup_required)location.replace('/login.html')}).catch(()=>location.replace('/'));if(location.search.includes('error=1'))document.getElementById('err').hidden=false;</script></body></html>
