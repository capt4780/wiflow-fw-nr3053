name: Audit NR3053 image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run whose firmware artifact is audited"
        required: true
      release:
        description: "Publish a release when the audit passes (yes/no)"
        default: "no"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: wiflow-nr3053-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Audit
        run: bash scripts/audit-image.sh dist/wiflow-*-sysupgrade.itb out/audit
      - name: Checksums
        run: cd dist && sha256sum wiflow-*-sysupgrade.itb > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: audited
          path: |
            dist/
            out/audit/
          retention-days: 30

  release:
    needs: audit
    if: github.event.inputs.release == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: audited
          path: a
      - name: Release notes
        run: |
          V="$(ls a/dist/wiflow-*-sysupgrade.itb | sed 's/.*wiflow-\([0-9.]*\)-.*/\1/')"; echo "V=$V" >> "$GITHUB_ENV"
          {
            echo "Firmware Wiflow $V cho Viettel NR3053 (nền ImmortalWrt v2.3.6 ổn định)."
            echo
            echo "Nạp: LuCI → System → Backup / Flash Firmware, **bỏ chọn Keep settings**. Hướng dẫn: docs/HUONG-DAN-NAP.md"
            echo
            echo '```'; cat a/dist/SHA256SUMS; echo '```'
            echo; echo '<details><summary>Kiểm tra image</summary>'; echo; echo '```'; cat a/out/audit/audit.txt; echo '```'; echo '</details>'
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nr3053-v${{ env.V }}-b${{ github.event.inputs.run_id }}
          name: Wiflow ${{ env.V }} — Viettel NR3053
          body_path: notes.md
          files: |
            a/dist/wiflow-*-sysupgrade.itb
            a/dist/SHA256SUMS
            a/out/audit/audit.txt
            a/out/audit/packages.txt
