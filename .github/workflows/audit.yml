name: Audit NR3053 image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run whose firmware artifact is audited"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: wiflow-nr3053-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Audit
        run: bash scripts/audit-image.sh dist/wiflow-*-sysupgrade.itb out/audit
