name: Wiflow Setup apk (NR3053)

# Builds the Wiflow Setup package for Wiflow OS (apk v3, noarch) and runs its
# regression tests on a bench with the real ubusd / rpcd / uci / ucode (same
# ucode commit as the router) and mock netifd, MediaTek WiFi and WordPress.

on:
  push:
    branches: ["**"]
    paths:
      - "apk/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-nr3053-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PFX: /opt/pfx
    steps:
      - uses: actions/checkout@v4

      - name: Tools (libubox, uci, ubus, rpcd, ucode, apk-tools 3.0.5)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libjson-c-dev libssl-dev zlib1g-dev iproute2
          sudo mkdir -p "$PFX" && sudo chown "$(id -u)" "$PFX"
          bash apk/test/deps.sh

      - name: Syntax
        run: |
          set -euo pipefail
          F=apk/wiflow/files
          for f in $F/usr/libexec/wiflow/* $F/usr/share/rpcd/ucode/wiflow; do
            LD_LIBRARY_PATH=$PFX/lib $PFX/ucode/ucode -L "$PFX/ucode/*.so" -L "$PWD/$F/usr/share/ucode/*.uc" -c -o /tmp/x.bin "$f"
            echo "ok $f"
          done
          for f in $F/www/wiflow/assets/*.js $F/www/luci-static/resources/view/wiflow/*.js; do
            { echo '(function(){'; cat "$f"; echo '})'; } > /tmp/check.js
            node --check /tmp/check.js && echo "ok $f"
          done
          for f in apk/wiflow/scripts/* $F/etc/init.d/wiflow $F/etc/hotplug.d/ntp/20-wiflow; do sh -n "$f" && echo "ok $f"; done
          python3 -c 'import json,glob; [json.load(open(f)) for f in glob.glob("apk/wiflow/files/usr/share/*/*.d/*.json")]' && echo "ok json"

      - name: Tests
        run: sudo -E env "PATH=$PATH" bash apk/test/run.sh | tee /tmp/tests.txt

      - name: Package
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH=$PFX/lib APK=$PFX/bin/apk OUT=dist sh apk/wiflow/build.sh
          f="$(ls dist/wiflow-setup-*.apk)"
          LD_LIBRARY_PATH=$PFX/lib $PFX/bin/apk adbdump "$f" | sed -n '1,30p'
          (cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          cp /tmp/tests.txt dist/tests.txt
          {
            echo "### Wiflow Setup"
            echo '```'; cat dist/tests.txt; echo '```'
            echo '```'; cat dist/SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wiflow-setup-apk
          path: dist/
          retention-days: 30

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" apk/wiflow/files/usr/share/ucode/wiflow/setup.uc)"
          TAG="wiflow-setup-v$V-b${{ github.run_number }}"
          {
            echo "Wiflow Setup $V cho Wiflow OS trên Viettel NR3053: giao diện Wiflow Setup như CR6609 (Trạng thái, Internet, WiFi khách, Hệ thống), Internet nguồn (dây LAN / WiFi nguồn / tự động), WiFi khách, tài khoản Wiflow."
            echo
            echo "- Nạp Wiflow OS mới nhất (mục Releases, nr3053-os-v1.0.0-…) trước: bản này cài được gói tải lên và không còn hiện lỗi giả khi cài."
            echo "- Cài: LuCI → System → Software → **Upload Package…** → chọn file \`.apk\` → Install."
            echo "- Sau khi cài, WiFi chưa đổi. Tải lại trang, bấm **Wiflow Setup** ở đầu thanh bên: bước 1 bấm **Bật Wiflow** (WiFi của router thành WiFi khách, mạng 10.10.10.x), bước 2 chọn dây LAN hoặc WiFi nguồn."
            echo
            echo '```'; cat dist/SHA256SUMS; echo '```'
            echo; echo '<details><summary>Kiểm tra</summary>'; echo; echo '```'; cat dist/tests.txt; echo '```'; echo '</details>'
          } > notes.md
          for old in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep "^wiflow-setup-v$V-b" || true); do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Wiflow Setup $V — NR3053 (build ${{ github.run_number }})" \
            --notes-file notes.md --target "$GITHUB_SHA" dist/wiflow-setup-*.apk dist/SHA256SUMS dist/tests.txt
