name: NR3053 Clean ImmortalWrt Base Build

# Compiles public pinned upstream only. No credentials or private Wiflow code.
# Generated image is for source validation only: DO NOT FLASH.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nr3053-base.yml"
      - "scripts/build-nr3053-base.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nr3053-public-base-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile and inspect NR3053 base image (NO FLASH)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout public build glue only
        uses: actions/checkout@v4
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU_COUNT=$(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"
          test "$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {print $4}')" -ge 15728640
      - name: Install ImmortalWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl libelf-dev \
            subversion swig time
      - name: Build upstream NR3053 with safety checks
        shell: bash
        run: bash scripts/build-nr3053-base.sh
      - name: Upload unvalidated build artifacts for engineering inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nr3053-public-base-NOT-FOR-FLASHING
          path: output/
          if-no-files-found: error
          retention-days: 3
