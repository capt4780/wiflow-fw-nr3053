name: Build NR3053 firmware

on:
  push:
    branches: [main]
    paths:
      - "package/**"
      - "config/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-nr3053
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: meta
        run: echo "version=$(sed -n 's/^PKG_VERSION:=//p' package/wiflow-setup/Makefile)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget \
            curl libelf-dev swig time device-tree-compiler squashfs-tools

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-aarch64_cortex-a53_gcc-*
          key: nr3053-toolchain-${{ hashFiles('scripts/prepare.sh') }}-v1

      - name: Restore download cache
        uses: actions/cache/restore@v5
        with:
          path: openwrt/dl
          key: nr3053-dl-${{ hashFiles('scripts/prepare.sh', 'config/nr3053.config') }}-${{ github.run_id }}
          restore-keys: |
            nr3053-dl-${{ hashFiles('scripts/prepare.sh', 'config/nr3053.config') }}-
            nr3053-dl-

      - name: Prepare source (v2.3.6, pinned feeds, Wiflow, lean config)
        run: bash scripts/prepare.sh openwrt

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build
        working-directory: openwrt
        run: |
          make -j"$(($(nproc) + 1))" || { echo "::warning::parallel build failed, retrying single-thread"; make -j1 V=s 2>&1 | tail -n 300; exit "${PIPESTATUS[0]}"; }

      - name: Collect
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          B=openwrt/bin/targets/mediatek/filogic
          ls -la "$B"
          mkdir -p dist
          itb="$(ls "$B"/*viettel_nr3053*squashfs-sysupgrade.itb | head -n1)"
          cp "$itb" "dist/wiflow-$V-viettel-nr3053-squashfs-sysupgrade.itb"
          cp "$B"/*viettel_nr3053*.manifest dist/packages.manifest 2>/dev/null || true
          cp out/nr3053.config dist/nr3053.config
          cp out/config-check.txt dist/config-check.txt

      - name: Audit the image
        run: bash scripts/audit-image.sh dist/wiflow-*-sysupgrade.itb dist/audit

      - name: Checksums
        run: cd dist && sha256sum wiflow-*-sysupgrade.itb > SHA256SUMS && cat SHA256SUMS

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiflow-nr3053-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            openwrt/logs/
            out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Free disk before cache save
        if: always()
        run: |
          cd openwrt 2>/dev/null || exit 0
          rm -rf bin tmp logs feeds build_dir/target-* staging_dir/target-* staging_dir/packages build_dir/linux-*
          df -h /

      - name: Save toolchain cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-aarch64_cortex-a53_gcc-*
          key: nr3053-toolchain-${{ hashFiles('scripts/prepare.sh') }}-v1

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: openwrt/dl
          key: nr3053-dl-${{ hashFiles('scripts/prepare.sh', 'config/nr3053.config') }}-${{ github.run_id }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wiflow-nr3053-${{ needs.build.outputs.version }}
          path: dist

      - name: Release notes
        run: |
          {
            echo "Firmware Wiflow ${{ needs.build.outputs.version }} cho Viettel NR3053 (nền ImmortalWrt v2.3.6 ổn định)."
            echo
            echo "Nạp: LuCI → System → Backup / Flash Firmware, **bỏ chọn Keep settings**. Hướng dẫn: docs/HUONG-DAN-NAP.md"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo '<details><summary>Kiểm tra image</summary>'
            echo
            echo '```'
            cat dist/audit/audit.txt
            echo '```'
            echo '</details>'
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nr3053-v${{ needs.build.outputs.version }}-b${{ github.run_number }}
          name: Wiflow ${{ needs.build.outputs.version }} — Viettel NR3053 (build ${{ github.run_number }})
          body_path: notes.md
          files: |
            dist/wiflow-*-sysupgrade.itb
            dist/SHA256SUMS
            dist/packages.manifest
            dist/audit/audit.txt
            dist/audit/packages.txt
